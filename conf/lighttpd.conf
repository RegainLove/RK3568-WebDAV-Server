# ============================================================
#  lighttpd WebDAV 配置  ->  /userdata/webdav/etc/lighttpd.conf
#  仅 HTTPS(443)；明文 8080 已关闭
# ============================================================

server.document-root        = "/userdata/webdav/data"
server.port                 = 443
server.bind                 = "0.0.0.0"
server.username             = "www-data"
server.groupname            = "www-data"
server.pid-file             = "/userdata/webdav/run/lighttpd.pid"
server.errorlog             = "/userdata/webdav/log/error.log"
server.upload-dirs          = ( "/userdata/webdav/tmp" )
server.max-request-size     = 0
server.network-backend      = "sendfile"

server.modules = (
    "mod_openssl",
    "mod_access",
    "mod_accesslog",
    "mod_auth",
    "mod_authn_file",
    "mod_setenv",
    "mod_alias",
    "mod_indexfile",
    "mod_dirlisting",
    "mod_staticfile",
    "mod_webdav",
)

# ---------------- TLS（自签证书，conf/gen-cert.sh 生成）----------------
ssl.engine               = "enable"
ssl.pemfile              = "/userdata/webdav/etc/server.pem"
ssl.openssl.ssl-conf-cmd = ("MinProtocol" => "TLSv1.2")

index-file.names            = ( "index.html", "index.htm" )
dir-listing.activate        = "enable"
dir-listing.encoding        = "utf-8"

mimetype.assign = (
    ".html" => "text/html; charset=utf-8",
    ".txt"  => "text/plain; charset=utf-8",
    ".jpg"  => "image/jpeg",
    ".png"  => "image/png",
    ".mp4"  => "video/mp4",
    ".mkv"  => "video/x-matroska",
    ".bin"  => "application/octet-stream",
)

# ---------------- 认证（{SHA} 必须用 htpasswd 后端）----------------
auth.backend                    = "htpasswd"
auth.backend.htpasswd.userfile  = "/userdata/webdav/etc/lighttpd.user"
auth.require = (
    "/" => (
        "method"  => "basic",
        "realm"   => "WebDAV",
        "require" => "valid-user"
    )
)

# ---------------- WebDAV ----------------
webdav.activate             = "enable"
webdav.is-readonly          = "disable"
webdav.sqlite-db-name       = "/userdata/webdav/run/webdav.db"

setenv.add-response-header = (
    "MS-Author-Via" => "DAV"
)

accesslog.filename          = "/userdata/webdav/log/access.log"
